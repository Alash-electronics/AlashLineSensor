sentence=Line sensor bar (QTR, TCRT5000) for line-following robots: calibration, line position, lost line, crossings, black or white line, analog or digital. No dependencies.
paragraph=Reads a bar of 1 to 16 reflectance sensors (QTR-5A, QTR-8A, TCRT5000 modules) for a line-following robot: calibrate() once, then position() gives the line position 0 to (n-1)*1000, offset() the deviation from the center for steering, lineLost() and crossing() for special cases. Black or white line, analog or digital sensors, 10-bit or 12-bit ADC, an optional emitter pin, averaging and a detection threshold. Explains calibration and wiring problems in Russian, Kazakh or English. Needs nothing besides the Arduino core. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and robot kits by Alash Electronics.
